<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f141c" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Skyrise: an original touch-first tower sim. Grow a tower floor by floor, keep every door reachable from the lobby, and chase five stars.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Skyrise">
  <meta property="og:description" content="An original touch-first tower sim for the phone browser. Grow a tower floor by floor, keep every door reachable, and chase five stars.">
  <meta property="og:site_name" content="Skyrise">
  <title>Skyrise</title>
  <link rel="icon" href="assets/art/app-icon-512.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/art/app-icon-512.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">
    <header class="hud" id="hud">
      <div class="hud-stats" role="group" aria-label="Tower status">
        <span class="stat cash" id="stat-cash" title="Cash">$0</span>
        <span class="stat" id="stat-pop" title="Population">0 ppl</span>
        <span class="stat stars" id="stat-stars" title="Rating: tap for the tower sheet" role="button" tabindex="0" aria-label="1 of 5 stars"><span id="stars-on" aria-hidden="true">★</span><span id="stars-off" aria-hidden="true">☆☆☆☆</span><span class="crown" id="stat-crown" title="Crowned" hidden>♛</span></span>
        <span class="stat net" id="stat-net" title="Net income per hour">+$0/h</span>
        <span class="stat clock" id="stat-clock" title="Time">Day 1 00:00</span>
      </div>
      <button class="icon-btn" id="btn-menu" type="button" aria-label="Menu" aria-haspopup="true" aria-controls="menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </header>

    <main class="stage">
      <canvas id="view" aria-label="Tower view"></canvas>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div class="guide" id="guide" role="note" aria-label="First-run guide" hidden>
        <p id="guide-text"></p>
        <button class="icon-btn guide-close" id="guide-close" type="button" aria-label="Hide the guide">×</button>
      </div>
      <div class="speed" id="speed" role="group" aria-label="Game speed"></div>
      <div class="card" id="card" role="dialog" aria-label="Room details" hidden>
        <div class="card-head">
          <strong id="card-title"></strong>
          <button class="icon-btn card-close" id="card-close" type="button" aria-label="Close">×</button>
        </div>
        <dl class="rows" id="card-rows"></dl>
        <div class="card-actions" id="card-actions"></div>
      </div>
      <div class="sheet" id="report" role="dialog" aria-modal="true" aria-labelledby="report-title" hidden>
        <h2 id="report-title">Quarter report</h2>
        <dl class="rows" id="report-rows"></dl>
        <button type="button" id="report-close">Continue</button>
      </div>
      <div class="sheet" id="win" role="dialog" aria-modal="true" aria-labelledby="win-title" hidden>
        <h2 id="win-title">♛ Your tower is crowned</h2>
        <p class="sheet-text" id="win-text"></p>
        <button type="button" id="win-close">Keep building</button>
      </div>
      <div class="sheet" id="over" role="dialog" aria-modal="true" aria-labelledby="over-title" hidden>
        <h2 id="over-title">Game over</h2>
        <p class="sheet-text" id="over-text"></p>
        <div class="slot-actions file-actions">
          <button type="button" id="over-load">Load a tower</button>
          <button type="button" id="over-new" class="danger">New tower</button>
        </div>
      </div>
      <div class="sheet" id="tower" role="dialog" aria-modal="true" aria-labelledby="tower-title" hidden>
        <h2 id="tower-title">Your tower</h2>
        <div class="tower-body">
          <div class="tower-text">
            <dl class="rows" id="tower-rows"></dl>
            <h3 id="needs-title"></h3>
            <ul class="needs" id="tower-needs"></ul>
          </div>
          <canvas class="minimap" id="minimap" width="120" height="315" aria-label="Mini map of the tower"></canvas>
        </div>
        <button type="button" id="tower-close">Close</button>
      </div>
      <div class="sheet" id="towers" role="dialog" aria-modal="true" aria-labelledby="towers-title" hidden>
        <h2 id="towers-title">Towers</h2>
        <div id="slot-list"></div>
        <div class="slot-actions file-actions">
          <button type="button" id="btn-export">Export file</button>
          <button type="button" id="btn-import">Import file</button>
          <input type="file" id="import-file" accept=".json,application/json" hidden>
        </div>
        <button type="button" id="towers-close">Close</button>
      </div>
      <div class="menu" id="menu" role="dialog" aria-label="Game menu" hidden>
        <img class="menu-logo" src="assets/art/logo-skyrise.png" alt="Skyrise" width="1024" height="256">
        <button type="button" data-action="save">Save now</button>
        <button type="button" data-action="tower">Tower</button>
        <button type="button" data-action="towers">Towers (save slots)</button>
        <button type="button" data-action="pause">Pause</button>
        <button type="button" data-action="theme">Theme: auto</button>
        <button type="button" data-action="recenter">Recenter view</button>
        <button type="button" data-action="new" class="danger">New tower</button>
        <p class="help" id="help"></p>
      </div>
    </main>

    <nav class="toolbar" id="toolbar" aria-label="Build tools"></nav>
  </div>
  <noscript><p class="noscript">Skyrise needs JavaScript to run.</p></noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
